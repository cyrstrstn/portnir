[workspace]
resolver = "2"
members = [
  "crates/portguard-core",
  "crates/portguard-cli",
  "apps/desktop/src-tauri",
]

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
